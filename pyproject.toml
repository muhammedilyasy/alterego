[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alterego"
version = "0.1.0"
description = "A personal AI agent with persistent identity, markdown memory, tools, skills and a proactive daemon — bring your own model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "alterego contributors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alterego = "alterego.cli:main"

[tool.setuptools.packages.find]
include = ["alterego*"]

[tool.setuptools.package-data]
alterego = ["templates/*.md", "templates/skills/*/SKILL.md", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
